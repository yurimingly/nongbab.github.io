<h1>농밥 개인정보처리방침</h1>
<p>농밥은 구내식당 주간 식단표를 보여주는 앱입니다.</p>
<p>농밥은 이용자의 이름, 연락처, 위치, 기기 식별자 등 어떠한 개인정보도 수집하거나 저장하거나 제3자에게 제공하지 않습니다. 회원가입과 로그인이 없으며, 광고·분석 도구를 사용하지 않습니다.</p>
<p>앱은 식단표 데이터 파일만 내려받아 표시합니다. 마지막으로 고른 끼니 필터만 이용자의 기기 안에 저장되며 외부로 전송되지 않습니다.</p>
<p>문의: 앱 스토어 등록 정보의 개발자 이메일</p>
<p>시행일: 2026년 10월 22일</p>
