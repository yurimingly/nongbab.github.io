name: 농밥 테스트 APK

# 앱 화면(docs/)이나 안드로이드 코드가 바뀌면 APK를 새로 만들어
# 저장소 Releases의 'test-apk'에 올립니다 → 폰에서 링크 하나로 받아 설치.
on:
  push:
    branches: [main]
    paths: ["docs/index.html", "docs/manifest.webmanifest", "docs/icon-*.png", "android/**", ".github/workflows/apk.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nongbab-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 식단 데이터 주소 정하기 (GitHub Pages)
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          if [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "${OWNER_LC}.github.io" ]; then
            URL="https://${OWNER_LC}.github.io/data/"
          else
            URL="https://${OWNER_LC}.github.io/${REPO}/data/"
          fi
          echo "NONGBAB_DATA_URL=$URL" >> "$GITHUB_ENV"
          echo "앱이 읽을 식단 주소: $URL (못 읽으면 앱에 든 데이터 사용)"

      - name: APK 빌드
        run: gradle -p android assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp android/build/outputs/apk/debug/*.apk nongbab.apk

      - name: Releases에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create test-apk nongbab.apk \
            --title "농밥 테스트 APK #${GITHUB_RUN_NUMBER}" \
            --notes "폰에서 nongbab.apk를 눌러 받은 뒤 설치하세요. (출처를 알 수 없는 앱 설치 허용 필요)" \
            --prerelease
