name: 농밥 테스트 APK

# 앱 화면(docs/)이나 안드로이드 코드가 바뀌면 APK를 새로 만들어
# 저장소 Releases의 'test-apk'에 올립니다 → 폰에서 링크 하나로 받아 설치.
on:
  push:
    branches: [main]
    paths: ["docs/**", "android/**", ".github/workflows/apk.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nongbab-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 식단 데이터 주소 정하기 (GitHub Pages)
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          if [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "${OWNER_LC}.github.io" ]; then
            URL="https://${OWNER_LC}.github.io/data/"
          else
            URL="https://${OWNER_LC}.github.io/${REPO}/data/"
          fi
          echo "NONGBAB_DATA_URL=$URL" >> "$GITHUB_ENV"
          echo "앱이 읽을 식단 주소: $URL (못 읽으면 앱에 든 데이터 사용)"

      # 두 가지를 만듭니다.
      #  nongbab.apk        내 폰용: '지금 새 식단 확인' 버튼이 봇을 바로 실행 (토큰 포함 → 남에게 주지 않기)
      #  nongbab-share.apk  공유용: 토큰 없음, 버튼 대신 자동 업데이트 안내만 표시
      - name: 내 폰용 APK 빌드
        env:
          NONGBAB_REFRESH_TOKEN: ${{ secrets.NONGBAB_REFRESH_TOKEN }}
        run: |
          gradle -p android assembleDebug --no-daemon
          cp android/build/outputs/apk/debug/*.apk nongbab.apk

      - name: 공유용 APK 빌드
        env:
          NONGBAB_REFRESH_TOKEN: ""
        run: |
          gradle -p android clean assembleDebug --no-daemon
          cp android/build/outputs/apk/debug/*.apk nongbab-share.apk
          if unzip -p nongbab-share.apk resources.arsc | strings | grep -q github_pat_; then
            echo "::error::공유용 APK에 토큰이 들어갔습니다"; exit 1
          fi

      - name: Releases에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create test-apk nongbab.apk nongbab-share.apk \
            --title "농밥 APK #${GITHUB_RUN_NUMBER}" \
            --notes "내 폰: nongbab.apk / 다른 사람에게 줄 때: nongbab-share.apk (출처를 알 수 없는 앱 설치 허용 필요)" \
            --prerelease
